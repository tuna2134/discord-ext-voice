# Continuous integration for discord-ext-voice.
#
# The native core links against the system FFmpeg and Opus libraries (libavformat,
# libavcodec, libavutil, libswresample, libopus), so every job installs the matching
# development packages first. Wheels built here are dynamically linked on purpose: see the
# "Requirements at runtime" section of the README.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust + Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg and Opus development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libopus-dev \
            ffmpeg

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest pytest-asyncio websockets 'discord.py[voice]>=2.7'

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --lib

      - name: Build and install the extension
        run: maturin develop

      - name: Python tests
        run: pytest -q

  build-wheel:
    name: Build a manylinux wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: --release --out dist
          # The build container does not ship FFmpeg, so install it before compiling.
          before-script-linux: |
            if command -v dnf > /dev/null; then
              dnf install -y pkgconf-pkg-config ffmpeg-free-devel opus-devel
            elif command -v yum > /dev/null; then
              yum install -y pkgconfig ffmpeg-devel opus-devel
            elif command -v apt-get > /dev/null; then
              apt-get update
              apt-get install --no-install-recommends -y pkg-config \
                libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libopus-dev
            else
              echo "no known package manager; FFmpeg development libraries are required" >&2
              exit 1
            fi

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

  sdist:
    name: Build the sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
