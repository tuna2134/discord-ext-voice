# Continuous integration for discord-ext-voice.
#
# The native core links nothing but libc: decoding, demuxing, resampling and the Opus codec are
# all pure Rust (`symphonia`, `rubato`, `oprs`). The `ffmpeg` binary is installed for the test
# fixtures, which use it to *create* media in each codec; the package itself never runs it.
#
# `patchelf` is installed as well: maturin uses it to rewrite the RPATH of the built
# extension, and warns (leaving the build-time RPATH in place) when it is missing.
#
# Wheels are built on the runner instead of inside a manylinux container: those containers
# ship no FFmpeg development packages (manylinux2014 has no `ffmpeg-devel` at all), and this
# project's wheels are deliberately linked against the system FFmpeg — see the runtime note
# under "Requirements" in the README. Each wheel is therefore tagged for the runner's glibc
# (`manylinux_2_39` on ubuntu-24.04) rather than for a portable baseline.
#
# The extension is not `abi3`, so a wheel is built for every supported CPython version, with
# `actions/setup-python` selecting the interpreter maturin builds against.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust + Python tests
    runs-on: [self-hosted, fcghact]
    env:
      # `maturin develop` installs into the active virtualenv, and `actions/setup-python`
      # provides an interpreter but no environment, so the job makes its own.
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v7

      - name: Install FFmpeg and Opus development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config patchelf \
            ffmpeg build-essential

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.15'

      - name: Create the virtualenv
        run: |
          python -m venv "$VIRTUAL_ENV"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"

      - name: Install Python tooling
        run: |
          "$VIRTUAL_ENV/bin/python" -m pip install --upgrade pip
          "$VIRTUAL_ENV/bin/python" -m pip install \
            maturin pytest pytest-asyncio websockets pynacl yt-dlp 'discord.py>=2.7'

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --lib

      - name: Build and install the extension
        run: maturin develop

      - name: Python tests
        run: pytest -q

  build-wheel:
    name: Build a wheel (CPython ${{ matrix.python-version }})
    runs-on: [self-hosted, fcghact]
    strategy:
      fail-fast: false
      matrix:
        # The whole supported range: 3.11 is the floor, so it has to keep building.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Install FFmpeg and Opus development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config patchelf build-essential

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.15,<2.0'

      - name: Build the wheel
        # `-i python` is the interpreter `actions/setup-python` put on PATH.
        run: maturin build --release --out dist -i python

      - name: Smoke-test the wheel in a clean environment
        run: |
          # A fresh environment proves the wheel carries every module and that its
          # `discord.py` dependency is enough to import it.
          python -m venv smoke
          smoke/bin/python -m pip install --upgrade pip
          smoke/bin/python -m pip install dist/*.whl
          smoke/bin/python -c "import discord_ext_voice as dev; print(dev.__version__, dev.SUPPORTED_MODES)"

      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64-cp${{ matrix.python-version }}
          path: dist

  sdist:
    name: Build the sdist
    runs-on: [self-hosted, fcghact]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist
