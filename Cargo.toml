[package]
name = "discord-ext-voice"
version = "0.1.0"
edition = "2024"
description = "A discord.py VoiceClient-compatible voice library built on pyo3, tokio-tungstenite, ac-ffmpeg, davey and audiopus"
license = "MIT"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "discord_ext_voice"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled when building a wheel (see `[tool.maturin] features`): do not link libpython.
extension-module = ["pyo3/extension-module"]
# Build a stable-ABI wheel that works on every supported CPython.
abi3 = ["pyo3/abi3-py38"]

[dependencies]
# Python bindings. `extension-module`/`abi3` are opt-in features so that `cargo test`
# links against libpython and the Rust unit tests can actually run.
pyo3 = "0.29"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

# Async runtime / websocket / udp
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
# TLS is layered manually (TcpStream -> tokio-rustls -> tokio-tungstenite), so the
# websocket crate only needs its handshake machinery, not its own TLS connectors.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
webpki-roots = "1"
futures-util = "0.3"

# Audio decoding / resampling
ac-ffmpeg = "0.19"

# Discord voice gateway protocol models (the maintained successor of the
# `voice-model` crate, renamed by its upstream)
voice-model = { package = "serenity-voice-model", version = "0.3" }

# Discord Audio & Video End-to-End Encryption (DAVE) / MLS
davey = "0.1.4"

# Opus codec
audiopus = "0.3.0-rc.0"

# Voice transport encryption
xsalsa20poly1305 = "0.9"
chacha20poly1305 = "0.10"

# Misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
rand = "0.8"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
