[package]
name = "discord-ext-voice"
version = "0.2.0"
edition = "2024"
description = "A discord.py VoiceClient-compatible voice library built on pyo3, tokio-tungstenite, symphonia, oprs and davey"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tuna2134/discord-ext-voice"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "discord_ext_voice"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled when building a wheel (see `[tool.maturin] features`): do not link libpython.
# There is no `abi3` feature: wheels are built per CPython version, so the extension may use
# the version-specific API (and, with it, the free-threading story of the interpreter it is
# built for).
extension-module = ["pyo3/extension-module"]

[dependencies]
# Python bindings. `extension-module` is an opt-in feature so that `cargo test` links against
# libpython and the Rust unit tests can actually run.
pyo3 = "0.30"
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }

# Async runtime / websocket / udp
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
# TLS is layered manually (TcpStream -> tokio-rustls -> tokio-tungstenite), so the
# websocket crate only needs its handshake machinery, not its own TLS connectors.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
webpki-roots = "1"
futures-util = "0.3"

# Audio demuxing, decoding and resampling, all in pure Rust: `symphonia` for the containers and
# codecs, `rubato` for the sample-rate conversion that libswresample used to do. Opus is the one
# codec symphonia has no decoder for, so those packets go to `oprs` (the same pure-Rust codec
# the encoder uses).
symphonia = { version = "0.6", default-features = false, features = [
    "aac", "adpcm", "aiff", "alac", "flac", "isomp4", "mkv", "mpa", "mp3", "ogg", "pcm",
    "vorbis", "wav", "all-meta", "opt-simd",
] }
rubato = "5"

# HTTP(S) inputs for the audio sources: a URL is streamed straight into the demuxer.
# `rustls-no-provider`
# + `webpki-roots` keeps the TLS stack the same one the voice websocket uses (and avoids OpenSSL).
#
# Not `rustls`: that feature pulls in `rustls/aws-lc-rs` as well, and rustls refuses to choose
# between two compiled-in providers — it panics with "Could not automatically determine the
# process-level CryptoProvider" the first time a TLS client is built. With no provider of its own,
# reqwest asks for the process default, which `_native` installs (ring) at import time.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "webpki-roots"] }

# Discord voice gateway protocol models (the maintained successor of the
# `voice-model` crate, renamed by its upstream)
voice-model = { package = "serenity-voice-model", version = "0.3" }

# Discord Audio & Video End-to-End Encryption (DAVE) / MLS
davey = "0.1.4"

# Opus codec. `oprs` is libopus 1.6.1 ported to pure Rust, with an `audiopus`-compatible API, so
# nothing links a C library any more. It is not on crates.io yet: the dependency comes from the
# repository and `Cargo.lock` pins the commit (`cargo update -p oprs` to move it).
oprs = { git = "https://github.com/tuna2134/oprs", branch = "master" }

# Voice transport encryption.
#
# These two are on different `aead` versions on purpose, and cannot be aligned: `chacha20poly1305`
# 0.11 uses aead 0.6 (its in-place trait is `AeadInOut`), while `xsalsa20poly1305` has not been
# released since 0.9.1 (2023) and still uses aead 0.5 (`AeadInPlace`). `crypto.rs` imports both
# traits anonymously, so each cipher resolves to its own; dropping either bump would break that
# arrangement rather than fix it.
xsalsa20poly1305 = "0.9"
chacha20poly1305 = "0.11"

# Misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.13"
rand = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
