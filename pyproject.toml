[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "discord-ext-voice"
description = "A discord.py VoiceClient-compatible Discord voice library powered by Rust (pyo3, tokio-tungstenite, rustls, ac-ffmpeg, davey, audiopus)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["discord", "voice", "discord.py", "opus", "dave", "e2ee", "pyo3"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Communications :: Conferencing",
]
dynamic = ["version"]
dependencies = [
    # `VoiceClient` subclasses `discord.VoiceClient`, which requires PyNaCl and the Python
    # `davey` bindings at construction time; discord.py's inherited bookkeeping also refers to
    # them. Our own crypto and DAVE session are native, so neither is actually used by us.
    "discord.py[voice]>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "websockets>=13"]

[tool.maturin]
module-name = "discord_ext_voice._native"
python-source = "python"
features = ["extension-module", "abi3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
