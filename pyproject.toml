[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "discord-ext-voice"
description = "A discord.py VoiceClient-compatible Discord voice library powered by Rust (pyo3, tokio-tungstenite, rustls, ac-ffmpeg, davey, audiopus)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["discord", "voice", "discord.py", "opus", "dave", "e2ee", "pyo3"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications :: Conferencing",
]
dynamic = ["version"]
dependencies = [
    # `VoiceClient` implements `discord.VoiceProtocol`, which is what has to come from
    # discord.py: the client, its gateway and the extension point itself. The `voice` extra
    # (PyNaCl + the Python `davey` bindings) is deliberately *not* needed — the RTP encryption
    # and the DAVE/MLS session are implemented natively in Rust, as are the player, the
    # connection flow, the audio sources and the websocket surface.
    "discord.py>=2.7",
]

[project.optional-dependencies]
# PyNaCl is used by the test suite only, to prove the native RTP packets are byte-compatible
# with discord.py's own encryption.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "websockets>=13", "pynacl>=1.5"]

[tool.maturin]
module-name = "discord_ext_voice._native"
python-source = "python"
# No `abi3`: one wheel per CPython version (3.11 and newer), built in CI for each of them.
features = ["extension-module"]
# Patching `ac-ffmpeg` with a git dependency (see patches/README.md) keeps the sdist small:
# `pip install <sdist>` fetches the fork rather than shipping a copy of it, at the cost of
# needing `git` and network access — exactly like building from a source checkout.
# The reference `discord.py` checkout some working copies carry is not part of this package.
exclude = ["discord.py/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
