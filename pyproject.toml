[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "discord-ext-voice"
description = "A discord.py VoiceClient-compatible Discord voice library powered by Rust (pyo3, tokio-tungstenite, rustls, ac-ffmpeg, davey, audiopus)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["discord", "voice", "discord.py", "opus", "dave", "e2ee", "pyo3"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Communications :: Conferencing",
]
dynamic = ["version"]
dependencies = [
    # `VoiceClient` implements `discord.VoiceProtocol` and reuses discord.py's player, audio
    # sources and connection-flow state machine. The `voice` extra (PyNaCl + the Python
    # `davey` bindings) is deliberately *not* needed: the RTP encryption and the DAVE/MLS
    # session are implemented natively in Rust.
    "discord.py>=2.7",
]

[project.optional-dependencies]
# PyNaCl is used by the test suite only, to prove the native RTP packets are byte-compatible
# with discord.py's own encryption.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "websockets>=13", "pynacl>=1.5"]

[tool.maturin]
module-name = "discord_ext_voice._native"
python-source = "python"
features = ["extension-module", "abi3"]
# Patching `ac-ffmpeg` with a git dependency (see patches/README.md) keeps the sdist small:
# `pip install <sdist>` fetches the fork rather than shipping a copy of it, at the cost of
# needing `git` and network access — exactly like building from a source checkout.
# The reference `discord.py` checkout some working copies carry is not part of this package.
exclude = ["discord.py/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
